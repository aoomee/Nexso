<title>Nexso · 界面预览</title><style>/* Shared application geometry: controls, surfaces and floating layers. */
:root {
  --ui-radius-small: 10px;
  --ui-radius-control: 16px;

  --ui-radius-surface: 24px;

  --ui-ease-out: cubic-bezier(.22, 1, .36, 1);
  --ui-duration-fast: 140ms;
  --ui-duration-normal: 220ms;
  --ui-duration-panel: 300ms;
}
.dark { --ui-shadow-floating: 0 8px 28px rgb(0 0 0 / .35); }
@layer components {
  .ui-control, .ui-button { border-radius: var(--ui-radius-control); }
  .ui-control { border-color: hsl(var(--input)); color: hsl(var(--foreground)); box-shadow: none; }
  .ui-control::placeholder { color: hsl(var(--muted-foreground)); opacity: 1; }
  .ui-surface { border-radius: var(--ui-radius-surface); border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: hsl(var(--card-foreground)); box-shadow: none; }
  .ui-menu { border-radius: var(--ui-radius-menu); border-color: hsl(var(--border)); box-shadow: var(--ui-shadow-floating); }
  .ui-dialog { border-radius: var(--ui-radius-dialog); border-color: hsl(var(--border)); box-shadow: var(--ui-shadow-floating); }
}
/* Keep a visible keyboard focus even where a utility removes the native outline. */
.ui-control:focus-visible, .ui-button:focus-visible {
  outline: 2px solid hsl(var(--ring));
  outline-offset: 2px;
}

/* Animate composited properties only; never interpolate pane/terminal dimensions. */
.ui-button, .ui-control {
  transition-property: background-color, border-color, color, box-shadow, opacity;
  transition-duration: var(--ui-duration-normal);
  transition-timing-function: var(--ui-ease-out);
}
.ui-button { transition-property: background-color, border-color, color, box-shadow, opacity, scale; }
.ui-button:not(:disabled):not([aria-disabled="true"]):active { scale: .98; transition-duration: var(--ui-duration-fast); }
.ui-menu {
  transform-origin: var(--radix-popover-content-transform-origin, var(--radix-context-menu-content-transform-origin, var(--radix-select-content-transform-origin, top center)));
  animation: ui-float-enter var(--ui-duration-normal) var(--ui-ease-out);
}
.ui-menu[data-state="closed"] { animation: ui-float-exit var(--ui-duration-fast) ease-in; }
.ui-dialog { animation: ui-dialog-enter var(--ui-duration-panel) var(--ui-ease-out); }
.ui-dialog[data-state="closed"] { animation: ui-dialog-exit 160ms ease-in; }
.ui-overlay { animation: ui-opacity-enter var(--ui-duration-normal) ease-out; }
.ui-overlay[data-state="closed"] { animation: ui-opacity-exit 160ms ease-in; }
.ui-panel-motion { animation: ui-panel-enter var(--ui-duration-panel) var(--ui-ease-out); }
.ui-panel-motion[data-native-view-occluder] { border-start-start-radius: var(--ui-radius-dialog); border-end-start-radius: var(--ui-radius-dialog); }
@keyframes ui-float-enter { from { opacity: 0; scale: .98; } to { opacity: 1; scale: 1; } }
@keyframes ui-float-exit { from { opacity: 1; scale: 1; } to { opacity: 0; scale: .985; } }
/* Individual scale/translate preserve the dialog's existing centering transform. */
@keyframes ui-dialog-enter { from { opacity: 0; scale: .975; } to { opacity: 1; scale: 1; } }
@keyframes ui-dialog-exit { from { opacity: 1; scale: 1; } to { opacity: 0; scale: .985; } }
@keyframes ui-panel-enter { from { opacity: 0; translate: 10px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes ui-opacity-enter { from { opacity: 0; } to { opacity: 1; } }
@keyframes ui-opacity-exit { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {

  }
  .ui-button:active { scale: none !important; }

/* Select positioning measures the open content; preserve its no-animation contract. */
.ui-menu.ui-menu-static { animation: none; }

/* Source-owned workspace design. Shared by the app and the visual review harness. */
.workspace-brand { display: inline-flex; align-items: center; gap: 10px; }
.workspace-brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--ui-radius-control); background: #eeebe9; color: #6b5b76; }

.workspace-toolbar .workspace-view-actions button:hover { background: hsl(var(--secondary)); color: hsl(var(--foreground)); }

@media (max-width: 900px) {

}
@media (prefers-reduced-motion: reduce) {

}

/* Compact collection geometry also matches the virtualizer's 52 px rows. */

/* A quiet surface response; compact row geometry stays unchanged. */
.workspace-host-card, .workspace-navigation button, .workspace-tabs .top-tab {
  transition-property: background-color, border-color, color, box-shadow;
  transition-duration: var(--ui-duration-normal);
  transition-timing-function: var(--ui-ease-out);
}
@media (hover: hover) {

    box-shadow: 0 3px 10px hsl(var(--foreground) / .07);

  }
}
.workspace-host-card:active { background: hsl(var(--secondary)); box-shadow: none; }
.workspace-tabs .top-tab-enter { animation: ui-opacity-enter var(--ui-duration-normal) var(--ui-ease-out); }
.workspace-navigation button { border-radius: 18px; }
.workspace-search-row input { border-radius: 19px; }
.workspace-count { border-radius: var(--ui-radius-small); }

@media(max-width:550px){body{padding:12px}.preview-window{height:calc(100vh - 72px);min-height:520px}.preview-top{padding:0 8px}.traffic{padding-right:8px;gap:5px}.traffic i{width:8px;height:8px}.preview-search-row{padding:12px}.workspace-search-row>.quiet-button{display:none}.preview-groups{gap:6px}.preview-group{padding:8px;gap:3px}.preview-group>svg{display:none}.preview-group strong{font-size:11px}.preview-hosts{grid-template-columns:1fr}.review-bottom>span:first-child{display:none}.host-group{display:none}.preview-tab{padding:0 8px}.page-heading h1{font-size:19px}}

.preview-content > .workspace-page-heading { padding:0 0 16px; }

.preview-group .folder-icon { width:26px;height:26px;background:transparent; }
.preview-group .folder-icon svg { width:18px;height:18px; }
.preview-group > svg { display:none; }
@media(max-width:550px) { .preview-group>span:nth-child(2) { flex-direction:column;align-items:flex-start;gap:0; } }

.review-note { align-items:center; }
.review-controls { display:flex;align-items:center;gap:12px; }
.review-controls button { background:hsl(var(--card));color:hsl(var(--foreground));border:1px solid hsl(var(--border));border-radius:var(--ui-radius-control);padding:6px 12px;font-size:11px;letter-spacing:0; }
.system-dialog { width:min(760px,calc(100vw - 40px));max-height:85vh;padding:24px;color:hsl(var(--foreground));background:hsl(var(--background));border:1px solid hsl(var(--border));border-radius:var(--ui-radius-dialog);box-shadow:var(--ui-shadow-floating); }
.system-dialog::backdrop { background:#141b2c66; }
.system-dialog header { display:flex;align-items:center;justify-content:space-between;margin-bottom:20px; }
.system-dialog h2 { color:hsl(var(--foreground));font-size:18px;margin-bottom:4px; }
.system-dialog p { font-size:12px;color:hsl(var(--muted-foreground)); }
.system-gallery { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
.system-gallery section { padding:16px; }
.system-gallery h3 { font-size:13px;margin-bottom:14px; }
.system-gallery label { display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:12px;color:hsl(var(--muted-foreground)); }
.system-gallery :is(input,select,textarea) { width:100%;min-height:36px;padding:8px 10px;background:hsl(var(--background));border:1px solid hsl(var(--input));border-radius:var(--ui-radius-control);color:hsl(var(--foreground)); }
.system-gallery textarea { resize:vertical;font:inherit;min-height:65px; }
.system-gallery .sample-actions { display:flex;gap:8px;flex-wrap:wrap;margin-top:14px; }
.system-gallery .sample-menu { padding:6px;background:hsl(var(--card));border:1px solid hsl(var(--border)); }
.sample-menu button { display:block;width:100%;text-align:left;padding:8px 10px;border-radius:var(--ui-radius-small);font-size:12px; }
.sample-menu button:hover,.sample-menu button:focus-visible { background:hsl(var(--secondary)); }
.sample-setting { display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid hsl(var(--border));font-size:12px; }
.sample-switch { width:34px;height:20px;padding:2px;border-radius:999px;background:hsl(var(--input)); }
.sample-switch[aria-checked=true] { background:hsl(var(--primary)); }
.sample-switch span { display:block;width:16px;height:16px;border-radius:50%;background:white; }
.sample-switch[aria-checked=true] span { transform:translateX(14px); }
.sample-badge { display:inline-block;background:hsl(var(--secondary));padding:3px 9px;border-radius:999px;font-size:11px; }
@media(max-width:650px) { .system-gallery { grid-template-columns:1fr; } .review-controls > span { display:none; } }
